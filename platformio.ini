; PlatformIO Project Configuration
[platformio]
default_envs = attiny84, attiny85
; Standard PlatformIO layout
src_dir = src
include_dir = src

[env]
platform = atmelavr
; No framework — bare-metal AVR-GCC
; 8 MHz internal oscillator
board_build.f_cpu = 8000000L
; Compiler flags matching Atmel Studio config
build_flags =
    -std=gnu99
    -funsigned-char
    -funsigned-bitfields
    -fpack-struct
    -fshort-enums
    -Wall
    -O1
    -lm
build_unflags = -Os
extra_scripts = post:copy_firmware.py

[env:attiny84]
board = attiny84
board_build.mcu = attiny84
build_flags =
    ${env.build_flags}
    -D ATTINY84

[env:attiny85]
board = attiny85
board_build.mcu = attiny85
build_flags =
    ${env.build_flags}
    -D ATTINY85
